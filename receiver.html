<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis Stage</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #141413; color: #F2EFE8; font-family: Georgia, serif; font-size: 5vw; }
  small { display: block; font-family: monospace; font-size: 1.6vw; color: #A8A29A; margin-top: 2vw; }
</style>
</head>
<body>
<div><span id="msg">Jarvis Stage — ready</span><small id="meta">spike receiver</small></div>
<script>
  // Placeholder receiver used to verify Cast launch + custom namespace. Replaced by the real renderer.
  const NS = "urn:x-cast:ai.jarvis.stage";
  const ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(NS, (event) => {
    document.getElementById("msg").textContent = event.data.text || JSON.stringify(event.data);
    document.getElementById("meta").textContent = "from " + event.senderId;
    ctx.sendCustomMessage(NS, event.senderId, { type: "ack", received: event.data });
  });
  const options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true;
  options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
  ctx.start(options);
</script>
</body>
</html>
